spring.application.name=customer-service
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.port=${CUSTOMER_SERVICE_PORT:8282}
server.address=${CUSTOMER_SERVICE_ADDRESS:127.0.0.1}

spring.datasource.url=${CUSTOMER_DB_URL:jdbc:postgresql://localhost:5434/customer_db}
spring.datasource.username=${CUSTOMER_DB_USERNAME:customer_app}
spring.datasource.password=${CUSTOMER_DB_PASSWORD}
spring.flyway.enabled=true
spring.sql.init.mode=never

logging.pattern.level=%5p [%X{correlationId:-}]

springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
security.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
security.jwt.audience=${CUSTOMER_JWT_AUDIENCE}
