spring.application.name=quote-service
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.port=${QUOTE_SERVICE_PORT:8281}
server.address=${QUOTE_SERVICE_ADDRESS:127.0.0.1}

spring.datasource.url=${INSURE_DB_URL}
spring.datasource.username=${INSURE_DB_USERNAME}
spring.datasource.password=${INSURE_DB_PASSWORD}

spring.flyway.enabled=true
spring.sql.init.mode=never

customer.service.base-url=${CUSTOMER_SERVICE_BASE_URL:http://localhost:8282}
customer.service.connect-timeout=${CUSTOMER_SERVICE_CONNECT_TIMEOUT:1s}
customer.service.read-timeout=${CUSTOMER_SERVICE_READ_TIMEOUT:2s}

logging.pattern.level=%5p [%X{correlationId:-}]

springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

security.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
security.jwt.audience=${QUOTE_JWT_AUDIENCE}
spring.security.oauth2.client.registration.customer-service.provider=keycloak
spring.security.oauth2.client.registration.customer-service.client-id=${KEYCLOAK_QUOTE_CLIENT_ID}
spring.security.oauth2.client.registration.customer-service.client-secret=${KEYCLOAK_QUOTE_CLIENT_SECRET}
spring.security.oauth2.client.registration.customer-service.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.customer-service.scope=customer:read
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URI}

quote.tax-rate=${QUOTE_TAX_RATE:0.18}
